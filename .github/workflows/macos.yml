name: macOS

on:
  push:
    branches:
      - macos
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:
    inputs:
      universal:
        description: Build both arm64 and x86_64 (release build)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select architectures
        id: arch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.universal }}" == "true" ]]; then
            echo "archs=arm64;x86_64" >> "$GITHUB_OUTPUT"
            echo "label=universal" >> "$GITHUB_OUTPUT"
          else
            echo "archs=arm64" >> "$GITHUB_OUTPUT"
            echo "label=arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: macos-${{ steps.arch.outputs.archs }}
          max-size: 500M

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_OSX_ARCHITECTURES=${{ steps.arch.outputs.archs }}"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Package
        run: cmake --build build --target macos_package

      - name: SHA-512
        run: shasum -a 512 build/package/*

      - uses: actions/upload-artifact@v4
        with:
          name: Toolscreen-macos-${{ steps.arch.outputs.label }}
          path: build/package/*
          if-no-files-found: error
